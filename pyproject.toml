[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "automated-screen-recorder"
version = "0.4.5"
description = "Local video-only Windows screen recording with normal, interval, and replay modes"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
http = ["fastapi>=0.143,<1", "uvicorn>=0.54,<1"]
dev = [
  "build>=1.2,<2",
  "httpx2>=2.13,<3",
  "mypy>=1.13,<2",
  "pkginfo>=1.13,<2",
  "pyinstaller>=6.22,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=7.1,<8",
  "ruff>=0.17,<0.18",
  "twine>=7,<8",
]

[project.scripts]
autoscreenrec = "automated_screen_recorder.cli:main"
autoscreenrec-http = "automated_screen_recorder.http:main"
autoscreenrec-benchmark = "automated_screen_recorder.benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["src/automated_screen_recorder"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["automated_screen_recorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = ["windows_desktop: requires interactive Windows desktop and FFmpeg"]

[tool.coverage.run]
branch = true
source = ["automated_screen_recorder"]

[tool.coverage.report]
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"
