name: Build, Sign and Release Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-release:
    name: Build, sign and release Windows executables
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      PYTHON_VERSION: "3.11"
      RELEASE_DIRECTORY: release
      UNSIGNED_DIRECTORY: unsigned
      SIGNED_CLI_DIRECTORY: signed-cli
      SIGNED_HTTP_DIRECTORY: signed-http

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Show build environment
        shell: pwsh
        run: |
          python --version
          python -m pip --version

          Write-Host "Repository: $env:GITHUB_REPOSITORY"
          Write-Host "Commit: $env:GITHUB_SHA"
          Write-Host "Tag: $env:GITHUB_REF_NAME"
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner architecture: $env:RUNNER_ARCH"

      - name: Validate release tag
        shell: pwsh
        run: |
          $Tag = "${{ github.ref_name }}"

          if ($Tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$') {
            throw (
              "The release tag does not use the expected format. " +
              "Examples: v0.3.0 or v0.3.0-beta.1. " +
              "Received: $Tag"
            )
          }

      - name: Upgrade packaging tools
        shell: pwsh
        run: |
          python -m pip install `
            --upgrade `
            pip `
            setuptools `
            wheel

      - name: Install project and build dependencies
        shell: pwsh
        run: |
          python -m pip install `
            --upgrade `
            -e ".[dev,http]"

      - name: Verify installed tools
        shell: pwsh
        run: |
          python -c "import automated_screen_recorder; print('Package:', automated_screen_recorder.__version__)"
          python -m PyInstaller --version

      - name: Determine package version
        id: version
        shell: pwsh
        run: |
          $PackageVersion = python -c `
            "import automated_screen_recorder; print(automated_screen_recorder.__version__)"

          $PackageVersion = $PackageVersion.Trim()
          $ReleaseTag = "${{ github.ref_name }}"
          $ExpectedTag = "v$PackageVersion"

          if (-not $PackageVersion) {
            throw "The package version could not be determined."
          }

          if ($ReleaseTag -ne $ExpectedTag) {
            throw (
              "The Git tag and package version do not match. " +
              "Tag: $ReleaseTag. " +
              "Expected tag: $ExpectedTag."
            )
          }

          Write-Host "Package version: $PackageVersion"
          Write-Host "Release tag: $ReleaseTag"

          "package_version=$PackageVersion" >> $env:GITHUB_OUTPUT

      - name: Verify PyInstaller entry points
        shell: pwsh
        run: |
          $EntryPoints = @(
            "scripts\standalone_entry.py",
            "scripts\http_entry.py"
          )

          foreach ($EntryPoint in $EntryPoints) {
            if (-not (Test-Path $EntryPoint)) {
              throw "Required entry point is missing: $EntryPoint"
            }
          }

      - name: Remove previous build artifacts
        shell: pwsh
        run: |
          $PathsToRemove = @(
            "build",
            "dist",
            "release",
            "unsigned",
            "signed-cli",
            "signed-http",
            "autoscreenrec.spec",
            "autoscreenrec-http.spec"
          )

          foreach ($PathToRemove in $PathsToRemove) {
            if (Test-Path $PathToRemove) {
              Remove-Item `
                -Path $PathToRemove `
                -Recurse `
                -Force
            }
          }

      - name: Build recorder CLI executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --console `
            --name autoscreenrec `
            --paths src `
            --collect-submodules automated_screen_recorder `
            scripts/standalone_entry.py

      - name: Build REST API executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --console `
            --name autoscreenrec-http `
            --paths src `
            --collect-submodules automated_screen_recorder `
            --collect-submodules fastapi `
            --collect-submodules starlette `
            --collect-submodules uvicorn `
            --collect-submodules pydantic `
            scripts/http_entry.py

      - name: Verify unsigned executables
        shell: pwsh
        run: |
          $Executables = @(
            "dist\autoscreenrec.exe",
            "dist\autoscreenrec-http.exe"
          )

          foreach ($ExecutablePath in $Executables) {
            if (-not (Test-Path $ExecutablePath)) {
              throw "Expected executable was not generated: $ExecutablePath"
            }

            $Executable = Get-Item $ExecutablePath

            if ($Executable.Length -eq 0) {
              throw "Generated executable is empty: $ExecutablePath"
            }

            Write-Host (
              "$($Executable.Name): " +
              "$($Executable.Length) bytes"
            )
          }

      - name: Smoke test recorder CLI
        shell: pwsh
        run: |
          & ".\dist\autoscreenrec.exe" --help

          if ($LASTEXITCODE -ne 0) {
            throw (
              "Recorder CLI smoke test failed with exit code " +
              "$LASTEXITCODE."
            )
          }

      - name: Smoke test REST API executable
        shell: pwsh
        run: |
          & ".\dist\autoscreenrec-http.exe" --help

          if ($LASTEXITCODE -ne 0) {
            throw (
              "REST API executable smoke test failed with exit code " +
              "$LASTEXITCODE."
            )
          }

      - name: Prepare unsigned signing inputs
        shell: pwsh
        run: |
          $Version = "${{ steps.version.outputs.package_version }}"

          New-Item `
            -ItemType Directory `
            -Path $env:UNSIGNED_DIRECTORY `
            -Force |
            Out-Null

          $CliName = (
            "autoscreenrec-" +
            $Version +
            "-windows-x64.exe"
          )

          $HttpName = (
            "autoscreenrec-http-" +
            $Version +
            "-windows-x64.exe"
          )

          Copy-Item `
            -Path "dist\autoscreenrec.exe" `
            -Destination (
              Join-Path $env:UNSIGNED_DIRECTORY $CliName
            )

          Copy-Item `
            -Path "dist\autoscreenrec-http.exe" `
            -Destination (
              Join-Path $env:UNSIGNED_DIRECTORY $HttpName
            )

          Write-Host "Unsigned signing inputs:"

          Get-ChildItem `
            -Path $env:UNSIGNED_DIRECTORY `
            -File

      - name: Upload unsigned CLI artifact
        id: upload-unsigned-cli
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-autoscreenrec-cli
          path: unsigned/autoscreenrec-*-windows-x64.exe
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned REST API artifact
        id: upload-unsigned-http
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-autoscreenrec-http
          path: unsigned/autoscreenrec-http-*-windows-x64.exe
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Submit CLI executable to SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-cli.outputs.artifact-id }}
