name: Windows CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev,http]"

      - name: Ruff blocking checks
        run: python -m ruff check . --ignore E501,I001

      - name: Ruff advisory checks
        continue-on-error: true
        run: python -m ruff check . --select E501,I001

      - name: Ruff formatting check
        run: python -m ruff format --check .

      - name: Static type checking
        run: python -m mypy src

      - name: Run tests with coverage
        run: >
          python -m pytest
          --cov=automated_screen_recorder
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Verify coverage report
        shell: pwsh
        run: |
          if (-not (Test-Path "coverage.xml")) {
            throw "coverage.xml was not generated."
          }

          $coverage = Get-Item "coverage.xml"

          if ($coverage.Length -eq 0) {
            throw "coverage.xml is empty."
          }

          Write-Host "Coverage report generated successfully."
          Write-Host "Path: $($coverage.FullName)"
          Write-Host "Size: $($coverage.Length) bytes"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  package:
    name: package
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install build dependencies
        run: python -m pip install -e ".[dev,http]"

      - name: Build Python distributions
        run: python -m build

      - name: Validate package metadata
        shell: pwsh
        run: |
          $distributions = @(
            Get-ChildItem -Path dist -File |
            Where-Object {
              $_.Extension -eq ".whl" -or
              $_.Name.EndsWith(".tar.gz")
            }
          )

          if ($distributions.Count -lt 2) {
            throw "Expected a wheel and source distribution in dist."
          }

          python -m twine check @($distributions.FullName)

      - name: Verify exactly one wheel was built
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem -Path dist -Filter *.whl -File)

          if ($wheels.Count -ne 1) {
            throw "Expected exactly one wheel, but found $($wheels.Count)."
          }

          Write-Host "Wheel: $($wheels[0].FullName)"

      - name: Test clean wheel installation
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem -Path dist -Filter *.whl -File)

          if ($wheels.Count -ne 1) {
            throw "Expected exactly one wheel, but found $($wheels.Count)."
          }

          $wheel = $wheels[0]

          python -m venv wheel-test-env

          .\wheel-test-env\Scripts\python.exe -m pip install --upgrade pip

          .\wheel-test-env\Scripts\python.exe -m pip install "$($wheel.FullName)"

          .\wheel-test-env\Scripts\python.exe -c "import automated_screen_recorder; print(automated_screen_recorder.__version__)"

      - name: Build standalone Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --name autoscreenrec `
            scripts/standalone_entry.py

      - name: Verify standalone executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/autoscreenrec.exe")) {
            throw "Standalone Windows executable was not generated."
          }

          $executable = Get-Item "dist/autoscreenrec.exe"

          if ($executable.Length -eq 0) {
            throw "Standalone Windows executable is empty."
          }

          Write-Host "Standalone executable:"
          Write-Host $executable.FullName

      - name: Upload Python distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Upload standalone Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: autoscreenrec-windows
          path: dist/autoscreenrec.exe
          if-no-files-found: error