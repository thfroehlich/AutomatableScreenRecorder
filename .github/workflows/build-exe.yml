name: Build and Release Windows EXE

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release"
        required: true
        default: false
        type: boolean

      release_tag:
        description: "Release tag for a manual release, for example v0.2.0"
        required: false
        type: string

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-exe:
    name: Build Windows x64 executable
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Show build environment
        shell: pwsh
        run: |
          python --version
          python -m pip --version

          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner architecture: $env:RUNNER_ARCH"

      - name: Upgrade packaging tools
        shell: pwsh
        run: |
          python -m pip install `
            --upgrade `
            pip `
            setuptools `
            wheel

      - name: Install project and build dependencies
        shell: pwsh
        run: |
          python -m pip install `
            --upgrade `
            -e ".[dev,http]"

      - name: Verify project import
        shell: pwsh
        run: |
          python -c "import automated_screen_recorder; print(automated_screen_recorder.__version__)"

      - name: Verify PyInstaller installation
        shell: pwsh
        run: |
          python -m PyInstaller --version

      - name: Remove previous build artifacts
        shell: pwsh
        run: |
          $PathsToRemove = @(
            "build",
            "dist",
            "autoscreenrec.spec",
            "release"
          )

          foreach ($PathToRemove in $PathsToRemove) {
            if (Test-Path $PathToRemove) {
              Remove-Item `
                -Path $PathToRemove `
                -Recurse `
                -Force
            }
          }

      - name: Verify standalone entry point
        shell: pwsh
        run: |
          if (-not (Test-Path "scripts/standalone_entry.py")) {
            throw (
              "The required scripts/standalone_entry.py " +
              "file was not found."
            )
          }

      - name: Build standalone executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --console `
            --name autoscreenrec `
            --paths src `
            --collect-submodules automated_screen_recorder `
            scripts/standalone_entry.py

      - name: Verify generated executable
        shell: pwsh
        run: |
          $ExecutablePath = "dist/autoscreenrec.exe"

          if (-not (Test-Path $ExecutablePath)) {
            throw (
              "The standalone Windows executable " +
              "was not generated."
            )
          }

          $Executable = Get-Item $ExecutablePath

          if ($Executable.Length -eq 0) {
            throw "The standalone Windows executable is empty."
          }

          Write-Host "Generated executable:"
          Write-Host "Path: $($Executable.FullName)"
          Write-Host "Size: $($Executable.Length) bytes"

      - name: Run executable smoke test
        shell: pwsh
        run: |
          $ExecutablePath = Resolve-Path "dist/autoscreenrec.exe"

          $Process = Start-Process `
            -FilePath $ExecutablePath `
            -ArgumentList "--help" `
            -NoNewWindow `
            -PassThru `
            -Wait

          if ($Process.ExitCode -ne 0) {
            throw (
              "The executable smoke test failed with " +
              "exit code $($Process.ExitCode)."
            )
          }

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          $PackageVersion = python -c `
            "import automated_screen_recorder; print(automated_screen_recorder.__version__)"

          $PackageVersion = $PackageVersion.Trim()

          if (-not $PackageVersion) {
            throw "Could not determine the package version."
          }

          Write-Host "Package version: $PackageVersion"

          "package_version=$PackageVersion" >> $env:GITHUB_OUTPUT

      - name: Prepare release files
        shell: pwsh
        run: |
          $Version = "${{ steps.version.outputs.package_version }}"

          New-Item `
            -ItemType Directory `
            -Path "release" `
            -Force |
            Out-Null

          $ReleaseExecutable = (
            "autoscreenrec-" +
            $Version +
            "-windows-x64.exe"
          )

          Copy-Item `
            -Path "dist/autoscreenrec.exe" `
            -Destination (
              Join-Path "release" $ReleaseExecutable
            )

          Write-Host (
            "Release executable: " +
            $ReleaseExecutable
          )

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $Executable = Get-ChildItem `
            -Path "release" `
            -Filter "*.exe" `
            -File |
            Select-Object -First 1

          if (-not $Executable) {
            throw "No release executable was found."
          }

          $Hash = Get-FileHash `
            -Path $Executable.FullName `
            -Algorithm SHA256

          $ChecksumLine = (
            $Hash.Hash.ToLowerInvariant() +
            "  " +
            $Executable.Name
          )

          $ChecksumPath = (
            $Executable.FullName +
            ".sha256"
          )

          Set-Content `
            -Path $ChecksumPath `
            -Value $ChecksumLine `
            -Encoding ascii

          Get-Content $ChecksumPath

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: autoscreenrec-windows-x64
          path: |
            release/*.exe
            release/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Determine GitHub Release tag
        id: release
        if: >
          github.ref_type == 'tag' ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.create_release
          )
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ReleaseTag = "${{ github.ref_name }}"
          }
          else {
            $ReleaseTag = "${{ inputs.release_tag }}".Trim()

            if (-not $ReleaseTag) {
              throw (
                "release_tag is required when creating " +
                "a manual GitHub Release."
              )
            }
          }

          if (-not $ReleaseTag.StartsWith("v")) {
            throw (
              "Release tags must start with 'v'. " +
              "Example: v0.2.0"
            )
          }

          Write-Host "Release tag: $ReleaseTag"

          "tag=$ReleaseTag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        if: >
          github.ref_type == 'tag' ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.create_release
          )
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ReleaseTag = "${{ steps.release.outputs.tag }}"

          $Assets = @(
            Get-ChildItem `
              -Path "release" `
              -File |
            Select-Object -ExpandProperty FullName
          )

          if ($Assets.Count -lt 2) {
            throw (
              "Expected the executable and checksum " +
              "before creating the release."
            )
          }

          $ExistingRelease = gh release view `
            $ReleaseTag `
            --json tagName `
            2>$null

          if ($LASTEXITCODE -eq 0) {
            Write-Host (
              "Release $ReleaseTag already exists. " +
              "Uploading current assets."
            )

            gh release upload `
              $ReleaseTag `
              $Assets `
              --clobber
          }
          else {
            Write-Host (
              "Creating GitHub Release $ReleaseTag."
            )

            gh release create `
              $ReleaseTag `
              $Assets `
              --verify-tag `
              --generate-notes `
              --title $ReleaseTag
          }